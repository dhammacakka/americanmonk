{{ define "main" }}
  <div class="mw8 center ph3 ph4-ns pv4">
    <div class="mb4">
      <p class="f6 ttu tracked fw6 mid-gray mb1">Category / Tag</p>
      <h1 class="f2 fw7 mt0 mb3">{{ .Title }}</h1>
    </div>

    {{ $posts := where .Pages "Section" "posts" }}
    {{ $sorted := sort $posts "Date" "desc" }}

    <div class="post-card-grid">
      {{ range $sorted }}
        {{ .Render "summary-with-image" }}
      {{ end }}
    </div>
  </div>
{{ end }}
