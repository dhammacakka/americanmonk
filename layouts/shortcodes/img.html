{{ $src := .Get "src" }}
{{ $cleanSrc := strings.TrimPrefix "/" $src }}
{{ $image := resources.Get $cleanSrc }}
{{ if not $image }}
  {{ $image = resources.Get $src }}
{{ end }}
{{ if $image }}
  <img src="{{ $image.RelPermalink }}" alt="{{ .Get "alt" | default "" }}" class="fancy-img" loading="eager" decoding="async">
{{ else }}
  <img src="{{ $src | relURL }}" alt="{{ .Get "alt" | default "" }}" class="fancy-img" loading="eager" decoding="async">
{{ end }}
