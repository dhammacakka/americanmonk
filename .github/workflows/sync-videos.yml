name: Sync YouTube Videos

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2:00 AM UTC
  workflow_dispatch:     # Allows clicking "Run workflow" manually in GitHub

permissions:
  contents: write # Allows committing the updated markdown files

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: ./scripts
        run: dart pub get

      - name: Run Video Sync
        working-directory: ./scripts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: dart run sync_videos.dart

      - name: Commit and push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No video changes detected."
          else
            git commit -m "chore(videos): auto-sync latest YouTube videos"
            git push
          fi
